# Exnovo Agentic OS web server: built UI + read-only quest API.
# Binds loopback only; Tailscale Serve publishes it to the tailnet over HTTPS (never Funnel):
#   tailscale serve --bg --https=5180 http://127.0.0.1:5180  ->  https://hermes-agent-stack.tail2c1149.ts.net:5180
# Deploy: npm run build && docker compose up -d   ·   Logs: docker logs -f exnovo-webui
services:
  exnovo-webui:
    image: node:22-alpine
    container_name: exnovo-webui
    working_dir: /app
    command: ["node", "server/index.mjs"]
    network_mode: host            # reaches Postgres on 127.0.0.1:5432
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOST: 127.0.0.1
      EXTRA_HOSTS: 172.21.0.1       # homepage_default bridge gateway: lets the Homepage tile widget read /api/summary (local containers only)
      PORT: "5180"
      DIST: /app/dist
      POLL_MS: "3000"
    env_file:
      - /home/claude-ops/netcup-mcp/keys/exnovo-api.env   # PGHOST/PGUSER/PGPASSWORD/PGDATABASE for the read-only role
    volumes:
      - /opt/exnovo-webui:/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5180/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
